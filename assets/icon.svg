  <rect x="140" y="40" width="76" height="56" rx="12" fill="#d9e4cd"/>
  <rect x="40" y="180" width="76" height="36" rx="12" fill="#d6ae70"/>
  <rect x="140" y="120" width="76" height="96" rx="12" fill="url(#sage)"/>
