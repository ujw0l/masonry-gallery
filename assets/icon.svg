    <rect x="140.5" y="40.5" width="75" height="55" rx="11.5"/>
    <rect x="40.5" y="180.5" width="75" height="35" rx="11.5"/>
    <rect x="140.5" y="120.5" width="75" height="95" rx="11.5"/>
